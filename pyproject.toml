[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qm9gap"
version = "0.1.0"
description = "How far do 2D molecular representations generalize? HOMO-LUMO gap prediction on QM9."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
